name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never phone home to checkpoint.hashicorp.com from tests or tooling.
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "1"

jobs:
  versions:
    name: Resolve pinned tool versions
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.pins.outputs.terraform }}
      golangci: ${{ steps.pins.outputs.golangci }}
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          echo "terraform=$(awk '/^terraform /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(awk '/^golangci-lint /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

  build:
    name: Build, vet, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ needs.versions.outputs.golangci }}
          # Stage 1: gate only issues introduced by the change; the pre-existing
          # findings are being worked down phase by phase.
          only-new-issues: true

  test-unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -short
        if: runner.os != 'Linux'
        run: go test -short ./... -timeout 20m
      - name: go test -short -race
        if: runner.os == 'Linux'
        run: go test -short -race ./... -timeout 20m

  test-offline:
    name: Offline tests (contract + fake-backed lifecycle)
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ needs.versions.outputs.terraform }}
          terraform_wrapper: false
      - name: make test
        run: make test

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check .changelog entry
        env:
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '0' }}
        run: scripts/check-changelog.sh "origin/${{ github.event.pull_request.base.ref }}"
