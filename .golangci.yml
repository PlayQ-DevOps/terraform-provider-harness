# golangci-lint v2 configuration.
#
# Stage 1 (now): only the issues introduced by a change are gated (golangci-lint run
# --new-from-rev=main ./...), while the pre-existing findings are worked down phase by
# phase. errcheck deliberately ignores schema.ResourceData.Set for now: ~2,000 call sites
# ignore its error today and they are addressed by helpers.SetAll in a dedicated step; the
# AST ratchet in internal/lint keeps that count from growing in the meantime.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
    govet:
      enable:
        - nilness
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments
        - -ST1003 # identifier naming (the generated-SDK style is pervasive)
        - -ST1005 # error strings capitalisation/punctuation (API messages are passed through)
        - -QF1*   # quickfix suggestions
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # FirstGen resources receive guardrails only; do not lint them beyond vet.
      - path: internal/service/cd/
        linters:
          - staticcheck
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
